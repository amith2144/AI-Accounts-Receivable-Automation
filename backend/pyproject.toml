[project]
name = "ar-backend"
version = "0.1.0"
description = "AI Accounts Receivable Automation Platform - Backend API and Worker Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "celery[redis]>=5.3.6",
    "redis>=5.0.3",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "boto3>=1.43.92",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
